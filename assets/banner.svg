<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1a1f2b" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4f8ef7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4f8ef7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#8fb6ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" rx="16" fill="#0d0f14"/>
  <rect width="1280" height="340" rx="16" fill="url(#grid)"/>
  <circle cx="980" cy="170" r="380" fill="url(#glow)"/>

  <!-- texto -->
  <g font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="92" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" fill="#4f8ef7" letter-spacing="2">// SOLUTIONS ARCHITECT · TECH LEAD · AI OPERATIONS</text>
    <text x="72" y="160" font-size="56" font-weight="800" fill="#f5f7fb">Nathan Amorim</text>
    <text x="72" y="208" font-size="24" font-weight="500" fill="#c3cad8">Da spec à produção com agentes de IA,</text>
    <text x="72" y="242" font-size="24" font-weight="500" fill="#c3cad8">governança e resultado mensurável.</text>
    <rect x="72" y="272" width="96" height="4" rx="2" fill="url(#line)"/>
  </g>

  <!-- pipeline de agentes -->
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" text-anchor="middle">
    <g stroke="#2a3245" stroke-width="2" fill="none">
      <path d="M920 92V120"/><path d="M920 168V196"/><path d="M920 244V272"/>
    </g>
    <g fill="#4f8ef7">
      <path d="M914 114l6 8 6-8z"/><path d="M914 190l6 8 6-8z"/><path d="M914 266l6 8 6-8z"/>
    </g>

    <rect x="820" y="52" width="200" height="40" rx="10" fill="#141925" stroke="#4f8ef7"/>
    <text x="920" y="77" fill="#f5f7fb">spec.md</text>

    <rect x="820" y="124" width="200" height="44" rx="10" fill="#141925" stroke="#2a3245"/>
    <text x="920" y="151" fill="#c3cad8">backlog → dev</text>

    <rect x="820" y="200" width="200" height="44" rx="10" fill="#141925" stroke="#2a3245"/>
    <text x="920" y="227" fill="#c3cad8">review → devops</text>

    <rect x="820" y="276" width="200" height="40" rx="10" fill="#4f8ef7"/>
    <text x="920" y="301" fill="#0d0f14" font-weight="700">produção ✓</text>

    <!-- anotações laterais -->
    <g text-anchor="start" font-size="12" fill="#6b7489">
      <text x="1044" y="77">humano aprova</text>
      <text x="1044" y="151">agentes executam</text>
      <text x="1044" y="227">qualidade e custo</text>
      <text x="1044" y="301">rastreável</text>
    </g>
  </g>
</svg>
